<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萬芳醫院藥事供應鏈專家系統 · 分享</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&family=Spline+Sans+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--pine:#13433f;--paper:#f4efe6;--ink:#1c2624;--ink-soft:#465450;--gold:#b8862f;--line:#d6cbb6;--card:#fbf8f1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(circle at 15% 0%,rgba(184,134,47,.07),transparent 42%),radial-gradient(circle at 90% 100%,rgba(19,67,63,.08),transparent 45%)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:440px;width:100%;padding:38px 34px;text-align:center;
    box-shadow:0 1px 2px rgba(28,38,36,.06),0 24px 60px -24px rgba(28,38,36,.28)}
  .kicker{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
  h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px;color:var(--pine);line-height:1.35}
  p.sub{color:var(--ink-soft);font-size:13.5px;margin:12px 0 26px}
  #qr{display:inline-block;padding:16px;background:#fff;border:1px solid var(--line);border-radius:8px}
  #qr img,#qr canvas{display:block}
  .url{margin-top:22px;font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--pine);word-break:break-all;background:rgba(19,67,63,.06);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .btn{display:inline-block;margin-top:18px;background:var(--pine);color:var(--paper);text-decoration:none;padding:12px 26px;border-radius:6px;font-weight:500;font-size:15px;transition:.2s;border:none;cursor:pointer}
  .btn:hover{background:#1d5c56}
  .copy{margin-top:10px;background:transparent;color:var(--pine);border:1.5px solid #3e7a6f;padding:9px 20px;border-radius:6px;font-family:'Noto Sans TC';font-size:13.5px;cursor:pointer}
  .copy:hover{background:rgba(29,92,86,.07)}
  .note{margin-top:22px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">TASC · OPA–ALWAS · Fuzzy Rough Sets</div>
    <h1>萬芳醫院藥事供應鏈<br>決策支援專家系統</h1>
    <p class="sub">手機掃碼即可開啟,於院內進行 TASC 準則權重與藥事績效指標評估。</p>
    <div id="qr"></div>
    <div class="url" id="urlText"></div>
    <div>
      <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener">開啟系統</a>
    </div>
    <div><button class="copy" onclick="copyUrl()">複製連結</button></div>
    <p class="note">資料於瀏覽器內運算,不外傳;專家以 E1–E7 匿名輸入,預設載入論文示範資料。<br>方法學依據:Sumrit &amp; Katthamaruesee (2026), Supply Chain Analytics 13:100187</p>
  </div>
<script>
  // 部署網址:同一 repo 根目錄即為系統首頁
  const SYS_URL = "https://maguro631023.github.io/wanfang-tasc-dss/";
  document.getElementById('urlText').textContent = SYS_URL;
  document.getElementById('openBtn').href = SYS_URL;
  new QRCode(document.getElementById('qr'), {text:SYS_URL, width:208, height:208, colorDark:"#13433f", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
  function copyUrl(){navigator.clipboard.writeText(SYS_URL).then(()=>{const b=event.target;const t=b.textContent;b.textContent='已複製 ✓';setTimeout(()=>b.textContent=t,1500);});}
</script>
</body>
</html>
